<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#313284"><link rel="manifest" href="./manifest.json"><link rel="icon" href="./icon-192.png"><link rel="stylesheet" href="./style.css"><title>Atlas Demo</title></head><body>
<header class="glass-header"><div class="wrap"><div class="brand-row"><div class="brand"><span class="logo">A</span><div><h1>Atlas <span class="badge">DEMO</span></h1><small>REAL ESTATE OS</small></div></div><span id="network" class="network" role="status"></span></div><p class="disclaimer">ข้อมูลสมมติอ้างอิงโครงสร้างชีทต้นแบบ — ไม่เชื่อมข้อมูลจริง</p><div class="controls"><label class="search"><span>⌕</span><input id="search" type="search" placeholder="ค้นหารหัส หรือชื่อโครงการ" aria-label="ค้นหารหัส หรือชื่อโครงการ"></label><div class="filters"><label>ประเภท<select id="type"><option value="">ทุกประเภท</option><option>Condo</option><option>House</option><option>Land</option></select></label><label>สถานะ<select id="status"><option value="">ทุกสถานะ</option><option>Available</option><option>Reserved</option></select></label><label>ราคาต่ำสุด<input id="min" inputmode="decimal" placeholder="Min"></label><label>ราคาสูงสุด<input id="max" inputmode="decimal" placeholder="Max"></label></div><div class="resultbar"><span id="count" aria-live="polite"></span><button id="reset" type="button">ล้างตัวกรอง</button></div><p id="validation" class="error" role="alert" hidden></p></div></div></header>
<main class="wrap"><div id="state" role="status">กำลังโหลดข้อมูลสมมติ…</div><div id="cards" class="cards"></div></main>
<dialog id="detail" aria-labelledby="detail-title"><div class="dialog-head"><span>รายละเอียดทรัพย์</span><button id="close" aria-label="ปิดรายละเอียด" type="button">✕</button></div><div id="detail-body"></div><button id="copy" class="primary" type="button">คัดลอกข้อมูล</button><p id="copy-status" role="status" aria-live="polite"></p><textarea id="copy-text" aria-label="ข้อความสำหรับคัดลอกด้วยตนเอง" readonly hidden></textarea></dialog>
<script type="module" src="./app.mjs"></script></body></html>
